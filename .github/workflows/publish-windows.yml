name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Package the game
        shell: pwsh
        run: .\build_release.ps1

      - name: Publish release and updater ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $archive = "release-output/$version/FocusQuest-$version-windows.zip"
          gh release create $version $archive `
            --repo $env:GITHUB_REPOSITORY `
            --title "Focus Quest $version" `
            --notes "Focus Quest $version" `
            --target $env:GITHUB_SHA
